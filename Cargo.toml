[package]
name = "quarry"
version = "0.1.0"
edition = "2021"
description = "a web access layer for coding agents"
license = "MIT"
default-run = "quarry"

[[bin]]
name = "quarry"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "zstd", "http2", "stream", "json"] }
scraper = "0.24"
ego-tree = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
url = "2"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
regex = "1"
once_cell = "1"
futures = "0.3"
html-escape = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
