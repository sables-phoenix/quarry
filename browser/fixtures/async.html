<!doctype html><html><head><meta charset='utf-8'><title>async</title><style>body{font-family:system-ui;margin:32px;max-width:720px}button{padding:8px 14px;margin:4px}input,select{display:block;margin:8px 0;padding:6px;min-width:260px}nav a{margin-right:12px}.err{color:#b00}.ok{color:#070}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}.tab[hidden]{display:none}.toast{background:#222;color:#fff;padding:8px 12px;display:inline-block}</style></head><body><h1>async</h1><button id=load>load report</button><p id=out aria-live=polite>not loaded</p><script>load.onclick=()=>{out.textContent='loading';setTimeout(()=>{out.textContent='report ready: 42 rows'},800)}</script></body></html>
