<!doctype html><html><head><meta charset='utf-8'><title>dashboard</title><style>body{font-family:system-ui;margin:32px;max-width:720px}button{padding:8px 14px;margin:4px}input,select{display:block;margin:8px 0;padding:6px;min-width:260px}nav a{margin-right:12px}.err{color:#b00}.ok{color:#070}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}.tab[hidden]{display:none}.toast{background:#222;color:#fff;padding:8px 12px;display:inline-block}</style></head><body><h1>welcome back</h1><p>signed in as ada@example.com</p><button id=inc>increment</button><span id=count aria-live=polite>0</span><button id=open>open dialog</button><dialog id=d><p>confirm transfer</p><button id=ok>confirm</button><button id=no>cancel</button></dialog><script>let n=0;inc.onclick=()=>{count.textContent=String(++n)};open.onclick=()=>d.showModal();ok.onclick=()=>{d.close();count.textContent='confirmed'};no.onclick=()=>d.close()</script></body></html>
