<!doctype html><html><head><meta charset='utf-8'><title>form</title><style>body{font-family:system-ui;margin:32px;max-width:720px}button{padding:8px 14px;margin:4px}input,select{display:block;margin:8px 0;padding:6px;min-width:260px}nav a{margin-right:12px}.err{color:#b00}.ok{color:#070}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}.tab[hidden]{display:none}.toast{background:#222;color:#fff;padding:8px 12px;display:inline-block}</style></head><body><h1>preferences</h1><form id=f><label for=plan>plan</label><select id=plan aria-label="plan"><option>free</option><option>pro</option></select><label><input type=radio name=bill value=monthly checked> monthly</label><label><input type=radio name=bill value=yearly> yearly</label><label><input type=checkbox id=news> newsletter</label><button type=submit>save</button></form><p id=out role=status></p><script>f.onsubmit=e=>{e.preventDefault();out.textContent=plan.value+' / '+document.querySelector('input[name=bill]:checked').value+' / newsletter '+(news.checked?'on':'off')}</script></body></html>
