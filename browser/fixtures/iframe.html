<!doctype html><html><head><meta charset='utf-8'><title>iframe</title><style>body{font-family:system-ui;margin:32px;max-width:720px}button{padding:8px 14px;margin:4px}input,select{display:block;margin:8px 0;padding:6px;min-width:260px}nav a{margin-right:12px}.err{color:#b00}.ok{color:#070}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}.tab[hidden]{display:none}.toast{background:#222;color:#fff;padding:8px 12px;display:inline-block}</style></head><body><h1>iframe</h1><iframe id=f src="/inner.html" width=420 height=180></iframe><p id=out role=status></p><script>setInterval(()=>{try{const d=document.getElementById('f').contentDocument;if(d&&d.getElementById('done')&&d.getElementById('done').dataset.hit==='1'){out.textContent='inner done'}}catch(e){}},100)</script></body></html>
