<!doctype html><html><head><meta charset='utf-8'><title>list</title><style>body{font-family:system-ui;margin:32px;max-width:720px}button{padding:8px 14px;margin:4px}input,select{display:block;margin:8px 0;padding:6px;min-width:260px}nav a{margin-right:12px}.err{color:#b00}.ok{color:#070}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}.tab[hidden]{display:none}.toast{background:#222;color:#fff;padding:8px 12px;display:inline-block}</style></head><body><h1>items</h1><input id=q aria-label="filter" placeholder="filter"><ul id=ul></ul><script>for(let i=1;i<=50;i++){const li=document.createElement('li');li.innerHTML='<a href="/item.html?id='+i+'">item '+i+'</a> price '+(i*3);li.dataset.name='item '+i;ul.append(li)};q.oninput=()=>{const v=q.value.toLowerCase();[...ul.children].forEach(li=>li.hidden=!li.textContent.toLowerCase().includes(v))}</script></body></html>
