<!doctype html><html><head><meta charset='utf-8'><title>modal</title><style>body{font-family:system-ui;margin:32px;max-width:720px}button{padding:8px 14px;margin:4px}input,select{display:block;margin:8px 0;padding:6px;min-width:260px}nav a{margin-right:12px}.err{color:#b00}.ok{color:#070}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}.tab[hidden]{display:none}.toast{background:#222;color:#fff;padding:8px 12px;display:inline-block}</style></head><body><h1>account</h1><button id=del>delete account</button><dialog id=d><p>this cannot be undone</p><button id=yes>yes delete</button><button id=no>keep account</button></dialog><p id=st role=status></p><script>del.onclick=()=>d.showModal();yes.onclick=()=>{d.close();st.textContent='account deleted'};no.onclick=()=>{d.close();st.textContent='account kept'}</script></body></html>
