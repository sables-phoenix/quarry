<!doctype html><html><head><meta charset='utf-8'><title>pagination</title><style>body{font-family:system-ui;margin:32px;max-width:720px}button{padding:8px 14px;margin:4px}input,select{display:block;margin:8px 0;padding:6px;min-width:260px}nav a{margin-right:12px}.err{color:#b00}.ok{color:#070}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}.tab[hidden]{display:none}.toast{background:#222;color:#fff;padding:8px 12px;display:inline-block}</style></head><body><h1>results</h1><ul id=ul></ul><p id=page aria-live=polite>page 1</p><button id=prev>previous</button><button id=next>next</button><script>let p=1;const render=()=>{ul.innerHTML='';for(let i=0;i<5;i++){const n=(p-1)*5+i+1;const li=document.createElement('li');li.textContent='result '+n;ul.append(li)}page.textContent='page '+p;prev.disabled=p===1;next.disabled=p===10};prev.onclick=()=>{if(p>1){p--;render()}};next.onclick=()=>{if(p<10){p++;render()}};render()</script></body></html>
