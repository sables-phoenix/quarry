<!doctype html><html><head><meta charset='utf-8'><title>shadow</title><style>body{font-family:system-ui;margin:32px;max-width:720px}button{padding:8px 14px;margin:4px}input,select{display:block;margin:8px 0;padding:6px;min-width:260px}nav a{margin-right:12px}.err{color:#b00}.ok{color:#070}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}.tab[hidden]{display:none}.toast{background:#222;color:#fff;padding:8px 12px;display:inline-block}</style></head><body><h1>shadow</h1><my-widget></my-widget><p id=out role=status></p><script>customElements.define('my-widget',class extends HTMLElement{constructor(){super();const r=this.attachShadow({mode:'open'});r.innerHTML='<button>activate widget</button><span></span>';r.querySelector('button').onclick=()=>{r.querySelector('span').textContent='widget active';document.getElementById('out').textContent='widget active'}}})</script></body></html>
