<!doctype html><html><head><meta charset='utf-8'><title>signup</title><style>body{font-family:system-ui;margin:32px;max-width:720px}button{padding:8px 14px;margin:4px}input,select{display:block;margin:8px 0;padding:6px;min-width:260px}nav a{margin-right:12px}.err{color:#b00}.ok{color:#070}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}.tab[hidden]{display:none}.toast{background:#222;color:#fff;padding:8px 12px;display:inline-block}</style></head><body><h1>sign up</h1><form id=f novalidate><label for=name>name</label><input id=fullname aria-label="name"><label for=email>email</label><input id=email aria-label="email" type="email"><label for=pw>password</label><input id=pw aria-label="password" type="password"><button type=submit>create account</button></form><p id=msg role=status></p><script>f.onsubmit=e=>{e.preventDefault();if(!fullname.value){msg.textContent='name required';return}if(!email.value.includes('@')){msg.textContent='email invalid';return}if(pw.value.length<8){msg.textContent='password too short';return}msg.textContent='account created for '+email.value}</script></body></html>
