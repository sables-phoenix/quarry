<!doctype html><html><head><meta charset='utf-8'><title>table</title><style>body{font-family:system-ui;margin:32px;max-width:720px}button{padding:8px 14px;margin:4px}input,select{display:block;margin:8px 0;padding:6px;min-width:260px}nav a{margin-right:12px}.err{color:#b00}.ok{color:#070}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}.tab[hidden]{display:none}.toast{background:#222;color:#fff;padding:8px 12px;display:inline-block}</style></head><body><h1>prices</h1><table><thead><tr><th><button id=sn>name</button></th><th><button id=sp>price</button></th></tr></thead><tbody id=tb></tbody></table><script>let rows=[['beta',30],['alpha',10],['gamma',20]];const render=()=>{tb.innerHTML='';rows.forEach(r=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+r[0]+'</td><td>'+r[1]+'</td>';tb.append(tr)})};sn.onclick=()=>{rows.sort((a,b)=>a[0].localeCompare(b[0]));render()};sp.onclick=()=>{rows.sort((a,b)=>a[1]-b[1]);render()};render()</script></body></html>
