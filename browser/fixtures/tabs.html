<!doctype html><html><head><meta charset='utf-8'><title>tabs</title><style>body{font-family:system-ui;margin:32px;max-width:720px}button{padding:8px 14px;margin:4px}input,select{display:block;margin:8px 0;padding:6px;min-width:260px}nav a{margin-right:12px}.err{color:#b00}.ok{color:#070}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}.tab[hidden]{display:none}.toast{background:#222;color:#fff;padding:8px 12px;display:inline-block}</style></head><body><h1>tabs</h1><div role=tablist><button role=tab id=t1 aria-selected=true>overview</button><button role=tab id=t2 aria-selected=false>billing</button><button role=tab id=t3 aria-selected=false>team</button></div><section id=p1 class=tab><p>overview content</p></section><section id=p2 class=tab hidden><p>billing content</p></section><section id=p3 class=tab hidden><p>team content</p></section><script>const go=i=>{for(let j=1;j<=3;j++){document.getElementById('t'+j).setAttribute('aria-selected',String(i===j));document.getElementById('p'+j).hidden=i!==j}};t1.onclick=()=>go(1);t2.onclick=()=>go(2);t3.onclick=()=>go(3)</script></body></html>
