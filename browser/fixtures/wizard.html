<!doctype html><html><head><meta charset='utf-8'><title>wizard</title><style>body{font-family:system-ui;margin:32px;max-width:720px}button{padding:8px 14px;margin:4px}input,select{display:block;margin:8px 0;padding:6px;min-width:260px}nav a{margin-right:12px}.err{color:#b00}.ok{color:#070}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}.tab[hidden]{display:none}.toast{background:#222;color:#fff;padding:8px 12px;display:inline-block}</style></head><body><h1>wizard</h1><p id=step aria-live=polite>step 1</p><div id=s1><label for=a>full name</label><input id=a aria-label="full name"></div><div id=s2 hidden><label for=b>company</label><input id=b aria-label="company"></div><div id=s3 hidden><p>review</p><p id=sum></p></div><button id=next>next</button><button id=back>back</button><script>let s=1;const show=()=>{step.textContent='step '+s;[s1,s2,s3].forEach((d,i)=>d.hidden=i!==s-1);sum.textContent=(a.value||'')+' / '+(b.value||'')};next.onclick=()=>{if(s<3)s++;show()};back.onclick=()=>{if(s>1)s--;show()}</script></body></html>
