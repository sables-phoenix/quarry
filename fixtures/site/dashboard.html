<!doctype html>
<html><head><meta charset="utf-8"><title>dashboard</title></head><body>
<h1>welcome back</h1><p id="who">signed in as ada@example.com</p>
<button id="inc">increment</button><span id="count" aria-live="polite">0</span>
<button id="open">open dialog</button>
<dialog id="d"><p>confirm transfer</p><button id="ok">confirm</button><button id="no">cancel</button></dialog>
<script>
var n=0;document.getElementById('inc').onclick=function(){n++;document.getElementById('count').textContent=String(n)};
document.getElementById('open').onclick=function(){document.getElementById('d').showModal()};
document.getElementById('ok').onclick=function(){document.getElementById('d').close();document.getElementById('count').textContent='confirmed'};
</script>
</body></html>
