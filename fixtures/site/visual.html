<!doctype html><html><head><meta charset="utf-8"><title>chart</title></head><body><h1>chart</h1><canvas id="c" width="640" height="360"></canvas><button id="b">regenerate</button><script>var c=document.getElementById("c"),x=c.getContext("2d");function draw(seed){x.fillStyle="#fff";x.fillRect(0,0,640,360);x.fillStyle="#0a7";for(var i=0;i<20;i++){var h=((i*seed*37)%300)+20;x.fillRect(i*30+10,360-h,20,h)}}var s=1;draw(s);document.getElementById("b").onclick=function(){s++;draw(s)}</script></body></html>
